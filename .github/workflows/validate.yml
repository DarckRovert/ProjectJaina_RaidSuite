name: ProjectJaina_RaidSuite - CI/CD Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # =========================================================
  # JOB 1: Validacion de estructura y sintaxis del addon
  # =========================================================
  structure-validate:
    name: Addon Structure & Ecosystem Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run validate_suite.py
        run: python Tests/validate_suite.py

  # =========================================================
  # JOB 2: Release ZIP (solo en push con tag vX.Y.Z)
  # =========================================================
  release:
    name: Build & Publish Release ZIP
    needs: [structure-validate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build ZIP
        run: |
          python Tests/build_release.py "${{ steps.version.outputs.VERSION }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "ProjectJaina_RaidSuite_*.zip"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
