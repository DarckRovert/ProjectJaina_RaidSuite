name: WoWPeru_RaidSuite — CI/CD Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # =========================================================
  # JOB 1: Validacion de sintaxis Lua
  # =========================================================
  lua-validate:
    name: Lua Syntax & API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Luacheck — Lint Lua 5.1
        run: |
          luacheck . \
            --globals CreateFrame UIParent GetTime UnitName UnitClass UnitLevel \
                      IsInInstance IsInRaid IsInGroup GetNumRaidMembers GetNumPartyMembers \
                      UnitIsDead UnitAura RegisterAddonMessagePrefix SendAddonMessage \
                      SendChatMessage PlaySoundFile strsplit DEFAULT_CHAT_FRAME ChatFrame1 \
                      SlashCmdList SLASH_SEQUITO1 SLASH_SEQUITO2 SLASH_SEQUITO3 SLASH_SEQUITO4 \
                      UNKNOWNOBJECT GetNumLootItems GetLootSlotInfo \
                      WoWPeru_GameModes_CharDB WoWPeru_GameModes_GlobalDB \
                      WoWPeru_BattlePass SequitoDB \
            --ignore 611 612 613 614 621 \
            --max-line-length 200 \
            --exclude-files=Tests/ \
            --std lua51
        continue-on-error: false

      - name: Python syntax check on Tests/
        run: python -m py_compile Tests/validate_suite.py

  # =========================================================
  # JOB 2: Validacion de estructura del addon
  # =========================================================
  structure-validate:
    name: Addon Structure & Ecosystem Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run validate_suite.py
        run: python Tests/validate_suite.py

  # =========================================================
  # JOB 3: Release ZIP (solo en push con tag vX.Y.Z)
  # =========================================================
  release:
    name: Build & Publish Release ZIP
    needs: [lua-validate, structure-validate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build ZIP
        run: |
          python Tests/build_release.py "${{ steps.version.outputs.VERSION }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "WoWPeru_RaidSuite_*.zip"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
